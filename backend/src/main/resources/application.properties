spring.application.name=campus-events
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_events_dev?currentSchema=campus}
spring.datasource.username=${DB_USER:campus_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
server.error.include-message=never
spring.jackson.deserialization.accept-float-as-int=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
campus.auth.secure-cookie=${AUTH_COOKIE_SECURE:false}

# Transactional email is opt-in; credentials are injected only into the backend.
campus.mail.enabled=${MAIL_ENABLED:false}
campus.mail.api-key=${BREVO_API_KEY:}
campus.mail.sender-email=${BREVO_SENDER_EMAIL:}
campus.mail.sender-name=${BREVO_SENDER_NAME:BKevent}
campus.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com}
campus.mail.max-attempts=${MAIL_MAX_ATTEMPTS:5}
campus.mail.poll-ms=${MAIL_POLL_MS:5000}
campus.mail.initial-delay-ms=${MAIL_INITIAL_DELAY_MS:10000}
campus.mail.allow-test-recipients=${MAIL_ALLOW_TEST_RECIPIENTS:false}
