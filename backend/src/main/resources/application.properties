spring.application.name=campus-events
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campus_events_dev?currentSchema=campus}
spring.datasource.username=${DB_USER:campus_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.sql.init.mode=never
server.error.include-message=never

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
campus.auth.secure-cookie=${AUTH_COOKIE_SECURE:false}
