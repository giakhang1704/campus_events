name: System validation
on:
  push:
    branches: [main, 'test/**', 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests and isolated PostgreSQL 17 migration/HTTP tests
        working-directory: backend
        run: mvn -B -Ppostgres-it clean test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: backend/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      I3_UI_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/smoke/package-lock.json
      - run: npm ci --prefix frontend && npm ci --prefix scripts/smoke
      - run: npm run build --prefix frontend
      - run: npm audit --prefix frontend --omit=dev --audit-level=high
      - run: node scripts/smoke/node_modules/playwright/cli.js install --with-deps chromium
      - name: Attendance and pagination UI regression contracts
        shell: bash
        run: |
          mkdir -p frontend/.angular/student-attendance
          (cd frontend && node node_modules/@angular/cli/bin/ng.js serve --host 127.0.0.1 --port 14206) > frontend/.angular/student-attendance/angular.log 2>&1 &
          UI_PID=$!
          trap 'kill "$UI_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:14206 >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke/i3_student_attendance_ui.cjs ./node_modules/playwright
          node scripts/smoke/system_regressions_ui.cjs ./node_modules/playwright
          node scripts/smoke/startup_ui.cjs ./node_modules/playwright
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-results
          path: frontend/.angular/student-attendance/
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        increment: [i1, i2, i3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate disposable fixture credentials
        shell: bash
        run: |
          TEST_DB_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          TEST_ACCOUNT_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')
          TEST_QR_KEY=$(python -c 'import secrets,base64; print(base64.b64encode(secrets.token_bytes(32)).decode())')
          echo "::add-mask::$TEST_DB_PASSWORD"
          echo "::add-mask::$TEST_ACCOUNT_PASSWORD"
          echo "::add-mask::$TEST_QR_KEY"
          echo "TEST_DB_PASSWORD=$TEST_DB_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_ACCOUNT_PASSWORD=$TEST_ACCOUNT_PASSWORD" >> "$GITHUB_ENV"
          echo "TEST_QR_KEY=$TEST_QR_KEY" >> "$GITHUB_ENV"
      - run: docker compose -f compose.${{ matrix.increment }}-test.yaml up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke/${{ matrix.increment }}_http.py
      - name: Import a production catalog unit without demo seed
        run: python scripts/seed-catalog.py --docker --compose-file compose.${{ matrix.increment }}-test.yaml --unit-name "Đơn vị CI O'Reilly"
      - name: Backup and restore into a new isolated database
        run: |
          python scripts/database-backup.py --docker --compose-file compose.${{ matrix.increment }}-test.yaml backup --output .backups/ci.dump
          python scripts/database-backup.py --docker --compose-file compose.${{ matrix.increment }}-test.yaml restore --input .backups/ci.dump --target-db bkevent_restore_ci
      - name: Capture service logs
        if: always()
        run: docker compose -f compose.${{ matrix.increment }}-test.yaml logs --no-color > integration.log
      - name: Stop isolated services
        if: always()
        run: docker compose -f compose.${{ matrix.increment }}-test.yaml down
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: http-${{ matrix.increment }}-logs
          path: integration.log
