const icon=(name,cls='')=>`<svg class="ico ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[name]||ICONS.grid}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const human={student:'Sinh viên',organizer:'Người tổ chức',admin:'Quản trị viên'};

function registration(status='Registered',checkin=false,checkout=false,order=0){return {status,checkin,checkout,order,checkinAt:checkin?'08:05':'',checkoutAt:checkout?'11:25':'',history:[]};}
function seed(){
 const users=[{id:'s1',name:'Nguyễn Minh Anh',studentId:'2210012',email:'minhanh@example.edu.vn',role:'student',faculty:shortFaculty,year:'3',locked:false},{id:'s2',name:'Trần Hoàng Nam',studentId:'2210048',email:'hoangnam@example.edu.vn',role:'student',faculty:shortFaculty,year:'3',locked:false},{id:'s3',name:'Lê Thảo Vy',studentId:'2210105',email:'thaovy@example.edu.vn',role:'student',faculty:shortFaculty,year:'2',locked:false},{id:'s4',name:'Phạm Gia Huy',studentId:'2210136',email:'giahuy@example.edu.vn',role:'student',faculty:shortFaculty,year:'4',locked:false},{id:'o1',name:'Nguyễn Thu Hà',email:'thuha@example.edu.vn',role:'organizer',faculty:shortFaculty,locked:false},{id:'a1',name:'Quản trị viên',email:'admin@example.edu.vn',role:'admin',faculty:'Quản trị hệ thống',locked:false}];
 const base={owner:'o1',unit:shortFaculty,description:'Cùng khám phá những góc nhìn mới, trao đổi với khách mời và kết nối với cộng đồng sinh viên. Chương trình gồm chia sẻ chuyên đề, hoạt động thực hành và phần hỏi đáp.',published:true,audience:'all',year:'all',openAt:'2026-11-01T08:00',phase:null,finished:false};
 const events=[
 {...base,id:'e1',title:'AI & Bạn: Từ ý tưởng đến ứng dụng',category:'Học thuật',poster:'AI &<br>YOU.',kicker:'TECH TALK / 2026',color:'',place:'Hội trường A1',startAt:'2026-11-15T08:00',endAt:'2026-11-15T11:30',closeAt:'2026-11-14T17:00',capacity:3,mode:'double',regs:{s1:registration(),s2:registration('Registered',true,true),s3:registration('Registered',true),s4:registration('Waitlisted',false,false,1)}},
 {...base,id:'e2',title:'Ngày hội kết nối doanh nghiệp 2026',category:'Nghề nghiệp',poster:'YOUR NEXT<br>CHAPTER.',kicker:'CAREER CONNECT',color:'green',place:'Sân trường · Khu B',startAt:'2026-11-18T08:30',endAt:'2026-11-18T16:00',closeAt:'2026-11-17T17:00',capacity:6,mode:'single',regs:{s1:registration(),s2:registration('Registered',true),s4:registration()}},
 {...base,id:'e3',title:'Workshop Gốm: Chạm vào sáng tạo',category:'Văn hóa',poster:'MAKE<br>SOMETHING.',kicker:'CREATIVE AFTERNOON',color:'orange',place:'Không gian sáng tạo C2',startAt:'2026-11-20T14:00',endAt:'2026-11-20T17:00',closeAt:'2026-11-19T17:00',capacity:2,mode:'single',regs:{s2:registration(),s3:registration()}},
 {...base,id:'e4',title:'Thiết kế sản phẩm số với UI/UX',category:'Học thuật',poster:'DESIGN<br>FOR PEOPLE.',kicker:'HANDS-ON WORKSHOP',color:'purple',place:'Phòng B4-302',startAt:'2026-11-22T09:00',endAt:'2026-11-22T12:00',closeAt:'2026-11-21T17:00',capacity:2,mode:'double',regs:{s2:registration(),s3:registration(),s1:registration('Waitlisted',false,false,1)}},
 {...base,id:'e5',title:'Chạy cùng nhau — Campus Run',category:'Thể thao',poster:'MOVE.<br>CONNECT.',kicker:'CAMPUS RUN / 2026',color:'yellow',place:'Sân vận động',startAt:'2026-10-25T06:00',endAt:'2026-10-25T08:00',closeAt:'2026-10-24T17:00',capacity:10,mode:'single',finished:true,regs:{s1:registration('Registered',true),s2:registration('Registered',true),s3:registration()}},
 {...base,id:'e6',title:'Định hướng nghề nghiệp cho sinh viên',category:'Nghề nghiệp',poster:'FIND YOUR<br>DIRECTION.',kicker:'DRAFT / CAMPUS EVENTS',color:'green',place:'Phòng A4-201',startAt:'2026-12-02T08:00',endAt:'2026-12-02T11:00',closeAt:'2026-12-01T17:00',capacity:50,mode:'double',published:false,regs:{}}
 ];return {schema:2,users,events,uid:'s1',role:'student',authenticated:true};
}
let state;try{state=JSON.parse(localStorage.getItem(STORE));if(state?.schema!==2)state=seed();}catch{state=seed();}
let page='explore',selected='e1',query='',category='Tất cả',mineFilter='all',peopleFilter='all',accountQuery='',phaseChoice='checkin',toastTimer;
const current=()=>state.users.find(x=>x.id===state.uid)||state.users[0];
const event=()=>state.events.find(e=>e.id===selected)||state.events[0];
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch{}}
function fmt(v,withYear=false){if(!v)return '';return new Intl.DateTimeFormat('vi-VN',{day:'2-digit',month:'2-digit',...(withYear?{year:'numeric'}:{})}).format(new Date(v));}
const time=v=>v?.slice(11,16)||'';
const stamp=()=>new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'});
const modeName=e=>e.mode==='double'?'2 lần · Check-in & check-out':'1 lần điểm danh';
function entries(e,status){return Object.entries(e.regs).filter(([,r])=>!status||r.status===status);}
const registered=e=>entries(e,'Registered');
const waiting=e=>entries(e,'Waitlisted').sort((a,b)=>a[1].order-b[1].order);
const complete=(e,r)=>!!r?.checkin&&(e.mode==='single'||!!r.checkout);
function metrics(e){const rows=registered(e);const n=rows.length,done=rows.filter(([,r])=>complete(e,r)).length,partial=rows.filter(([,r])=>r.checkin&&!complete(e,r)).length;return {n,done,partial,notStarted:n-done-partial,waiting:waiting(e).length,rate:n?Math.round(done/n*100):null};}
const initials=name=>name.split(' ').slice(-2).map(x=>x[0]).join('');
function badge(label,color=''){return `<span class="badge ${color}">${esc(label)}</span>`;}
function regBadge(e,r,uid=state.uid){if(!r)return '';return r.status==='Registered'?badge('Đã đăng ký'):r.status==='Waitlisted'?badge('Đang chờ · #'+(waiting(e).findIndex(([id])=>id===uid)+1),'amber'):badge('Đã hủy','gray');}
function attBadge(e,r){if(!r||r.status!=='Registered')return badge('—','gray');return complete(e,r)?badge('Đã hoàn tất'):r.checkin?badge('Đã check-in · Thiếu check-out','amber'):badge(e.finished?'Vắng mặt':'Chưa điểm danh','gray');}
function eligible(e,u=current()){return (e.audience==='all'||e.audience===u.faculty)&&(e.year==='all'||e.year===u.year);}
function registrationOpen(e){const now=new Date();return e.published&&!e.finished&&now>=new Date(e.openAt)&&now<new Date(e.closeAt)&&now<new Date(e.startAt);}
const canCancel=e=>!e.finished&&new Date()<new Date(e.startAt);
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3800);}
function closeModal(){$('#modal').close();}
function modal(title,body,action,label='Xác nhận',ico='info'){$('#modalBody').innerHTML=`<div class="modal-icon">${icon(ico)}</div><h2 id="modalTitle">${esc(title)}</h2>${body}<div class="form-error" id="modalError" role="alert"></div><div class="modal-actions"><button onclick="closeModal()">Quay lại</button><button class="primary" id="modalConfirm">${esc(label)}</button></div>`;$('#modalConfirm').onclick=()=>{try{if(action()!==false)closeModal();}catch(err){$('#modalError').textContent=err.message;}};$('#modal').showModal();}
function error(text){$('#modalError').textContent=text;return false;}
const menu={student:[['explore','grid','Khám phá sự kiện'],['mine','calendar','Sự kiện của tôi'],['scan','qr','Điểm danh QR']],organizer:[['manage','grid','Sự kiện quản lý'],['create','plus','Tạo sự kiện'],['participants','users','Người tham gia'],['attendance','qr','Điểm danh'],['report','chart','Báo cáo']],admin:[['accounts','users','Quản lý tài khoản'],['account-create','plus','Cấp tài khoản']]};
function brand(){return '<a class="brand" href="#" onclick="goHome();return false"><span class="brand-mark">ce</span><span>campus<em>events</em></span></a>';}
function nav(mobile=false){return menu[state.role].map(([p,ico,label])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${icon(ico)}<span>${mobile&&p==='explore'?'Khám phá':mobile&&p==='mine'?'Của tôi':mobile&&p==='scan'?'Quét QR':label}</span>${!mobile&&p==='mine'?`<span class="nav-count">${state.events.filter(e=>['Registered','Waitlisted'].includes(e.regs[state.uid]?.status)).length}</span>`:''}</button>`).join('');}
function shell(content){const u=current(),role=state.role;const title=menu[role].find(x=>x[0]===page)?.[2]||'Chi tiết sự kiện';return `<aside class="sidebar ${role}">${brand()}<div class="school">KHÔNG GIAN SỰ KIỆN SINH VIÊN</div><div class="nav-caption">${role==='student'?'KHÔNG GIAN CỦA BẠN':role==='organizer'?'KHÔNG GIAN TỔ CHỨC':'QUẢN TRỊ HỆ THỐNG'}</div><nav class="nav">${nav()}</nav><div class="sidebar-bottom"><div class="side-note"><strong>Mọi lượt tham gia đều rõ ràng.</strong>Theo dõi đăng ký, điểm danh và kết quả trong cùng một không gian.</div><div class="profile"><span class="avatar">${initials(u.name)}</span><div><b>${esc(u.name)}</b><small>${human[role]}</small></div></div></div></aside><div class="workspace ${role==='student'?'student-workspace':''}"><header class="topbar"><div class="breadcrumb">${human[role]}<span>/</span>${esc(title)}</div><div class="top-actions"><span class="demo-pill">Bản tương tác mẫu</span><select class="role-select" aria-label="Xem theo vai trò" onchange="setRole(this.value)">${Object.entries(human).map(([id,name])=>`<option value="${id}" ${id===role?'selected':''}>${name}</option>`).join('')}</select><span class="avatar">${initials(u.name)}</span><button class="ghost logout" title="Đăng xuất" aria-label="Đăng xuất" onclick="logout()">${icon('logout')}</button></div></header><main>${content}</main><footer><b>Campus Events</b><span>Dữ liệu minh họa · ${new Date().getFullYear()}</span></footer></div>${role==='student'?`<nav class="mobile-nav" aria-label="Điều hướng sinh viên">${nav(true)}</nav>`:''}`;}
function goHome(){go(menu[state.role][0][0]);}
function setRole(role){state.role=role;state.uid=role==='student'?'s1':role==='organizer'?'o1':'a1';state.authenticated=true;selected='e1';query='';category='Tất cả';peopleFilter='all';page=menu[role][0][0];persist();render();}
function go(p){page=p;query='';category='Tất cả';peopleFilter='all';render();window.scrollTo(0,0);}
function openEvent(id,destination='detail'){selected=id;phaseChoice='checkin';go(destination);}
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">CAMPUS EVENTS</div><h1>${title}</h1><p>${sub}</p></div>${action?`<div class="actions">${action}</div>`:''}</div>`;}
function picker(){const choices=state.events.filter(e=>e.owner===state.uid||state.role!=='organizer');if(!choices.some(e=>e.id===selected))selected=choices[0]?.id||'e1';return `<select class="event-select" aria-label="Chọn sự kiện" onchange="selected=this.value;phaseChoice='checkin';render()">${choices.map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${esc(e.title)}</option>`).join('')}</select>`;}
function empty(title,sub,action=''){return `<div class="empty">${icon('calendar')}<h3>${title}</h3><p>${sub}</p>${action}</div>`;}
function eventCard(e){const r=e.regs[state.uid],m=metrics(e);return `<article class="card"><div class="poster ${e.color}"><small>${e.kicker}</small><strong>${e.poster}</strong><span class="poster-tag">${fmt(e.startAt)}</span></div><div class="card-body"><span class="category">${esc(e.category)}</span><h3>${esc(e.title)}</h3><div class="meta">${icon('clock')}${fmt(e.startAt,true)} · ${time(e.startAt)}<br>${icon('pin')}${esc(e.place)}</div><div class="mode-label">${icon(e.mode==='double'?'repeat':'check')}${modeName(e)}</div>${page==='mine'&&r?.status==='Registered'?`<div class="att-chip"><span>Điểm danh</span>${attBadge(e,r)}</div>`:''}<div class="card-foot">${regBadge(e,r)||badge(e.finished?'Đã kết thúc':m.n>=e.capacity?'Đã đủ chỗ':`Còn ${e.capacity-m.n} chỗ`,e.finished?'gray':m.n>=e.capacity?'amber':'blue')}<button class="text-button" onclick="openEvent('${e.id}')">Chi tiết ${icon('arrow')}</button></div></div></article>`;}
function filteredEvents(){return state.events.filter(e=>e.published&&(page!=='mine'||e.regs[state.uid])&&(mineFilter==='all'||page!=='mine'||e.regs[state.uid]?.status===mineFilter)&&(category==='Tất cả'||e.category===category)&&e.title.toLocaleLowerCase('vi').includes(query.toLocaleLowerCase('vi')));}
function fillCards(){const list=filteredEvents();$('#cards').innerHTML=list.length?list.map(eventCard).join(''):empty('Chưa có sự kiện phù hợp','Thử đổi từ khóa hoặc xem các sự kiện khác.',`<button onclick="go('explore')">Khám phá sự kiện ${icon('arrow')}</button>`);$('#resultCount').textContent=`${list.length} sự kiện`;}
function explore(mine=false){return head(mine?'Sự kiện của tôi':'Khám phá sự kiện',mine?'Lịch hẹn, trạng thái đăng ký và từng lượt điểm danh của bạn.':'Tìm những hoạt động bạn muốn tham gia tại trường.')+(!mine?`<section class="hero"><div><div class="eyebrow">KHÁM PHÁ · HỌC HỎI · KẾT NỐI</div><h2>Bước ra khỏi lớp học.<br>Thêm một trải nghiệm mới.</h2><p>Seminar, workshop và những cuộc gặp gỡ dành cho cộng đồng sinh viên.</p><button class="primary" onclick="$('#eventSearch').focus()">Tìm sự kiện của bạn ${icon('arrow')}</button></div><div class="hero-art" aria-hidden="true"><div class="ticket"><small>YOUR CAMPUS. YOUR MOMENT.</small><strong>LET’S<br>CONNECT.</strong><div class="ticket-line"><span>ADMIT ONE</span><span>✦ 2026</span></div></div><span class="star">✦</span></div></section>`:'')+`<div class="section-head"><div><h2>${mine?'Lịch hẹn của bạn':'Sự kiện tại trường'}</h2><p id="resultCount"></p></div>${mine?`<select class="role-select" aria-label="Lọc đăng ký" onchange="mineFilter=this.value;fillCards()"><option value="all" ${mineFilter==='all'?'selected':''}>Tất cả trạng thái</option><option value="Registered" ${mineFilter==='Registered'?'selected':''}>Đã đăng ký</option><option value="Waitlisted" ${mineFilter==='Waitlisted'?'selected':''}>Đang chờ</option><option value="Cancelled" ${mineFilter==='Cancelled'?'selected':''}>Đã hủy</option></select>`:'<span class="muted small-text">Lịch hoạt động 2026</span>'}</div><div class="toolbar"><label class="search">${icon('search')}<input id="eventSearch" aria-label="Tìm sự kiện" placeholder="Tìm tên sự kiện bạn quan tâm..." value="${esc(query)}" oninput="query=this.value;fillCards()"></label><div class="chips">${['Tất cả','Học thuật','Nghề nghiệp','Văn hóa','Thể thao'].map(c=>`<button class="${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div></div><div class="grid" id="cards"></div>`;}
function timeline(e,r){return `<div class="timeline"><div class="step ${r?.checkin?'done':''}"><span class="step-icon">${r?.checkin?'✓':'1'}</span><b>${e.mode==='double'?'Check-in · Lượt vào':'Điểm danh một lần'}</b><small>${r?.checkin?`Đã ghi nhận lúc ${r.checkinAt||'—'}`:'Chưa ghi nhận'}</small></div>${e.mode==='double'?`<div class="step ${r?.checkout?'done':''}"><span class="step-icon">${r?.checkout?'✓':'2'}</span><b>Check-out · Lượt ra</b><small>${r?.checkout?`Đã ghi nhận lúc ${r.checkoutAt||'—'}`:'Hoàn tất lượt này để được tính tham dự'}</small></div>`:''}</div>`;}
function detail(){const e=event(),r=e.regs[state.uid],m=metrics(e);let cta='';if(r&&['Registered','Waitlisted'].includes(r.status)){cta=`${r.status==='Registered'?`<div class="gap-top">${attBadge(e,r)}${timeline(e,r)}</div>${!e.finished?`<button class="primary block" onclick="go('scan')">${icon('qr')} Điểm danh bằng QR</button>`:''}`:`<div class="notice warn">Bạn đang ở vị trí <b>#${waiting(e).findIndex(([id])=>id===state.uid)+1}</b>. Khi có chỗ, hệ thống sẽ tự chuyển lên và thông báo cho bạn.</div>`}<button class="block gap-top" onclick="cancelEvent()" ${canCancel(e)?'':'disabled'}>${r.status==='Waitlisted'?'Rời danh sách chờ':'Hủy đăng ký'}</button>`;}else cta=`<button class="primary block gap-top" onclick="registerEvent()" ${registrationOpen(e)&&eligible(e)?'':'disabled'}>${e.finished?'Sự kiện đã kết thúc':!eligible(e)?'Không thuộc đối tượng tham gia':!registrationOpen(e)?'Ngoài thời gian đăng ký':m.n>=e.capacity?'Tham gia danh sách chờ':'Đăng ký tham gia'} ${icon('arrow')}</button>`;
 return `<button class="ghost back" onclick="go('explore')">${icon('back')} Quay lại danh sách</button><div class="split"><section class="panel detail-copy"><div class="poster detail-poster ${e.color}"><small>${e.kicker}</small><strong>${e.poster}</strong></div><span class="category">${e.category}</span><h1 class="gap-top">${esc(e.title)}</h1><p class="gap-top">Tổ chức bởi ${esc(e.unit)}</p><h3>Về sự kiện</h3><p>${esc(e.description)}</p><h3>Điểm danh tại sự kiện</h3><div class="notice">${e.mode==='double'?'Sự kiện yêu cầu check-in và check-out. Bạn cần hoàn thành cả hai lượt để được tính tham dự.':'Bạn chỉ cần quét QR hợp lệ một lần để hoàn tất điểm danh.'}</div><p>Nếu đến muộn hoặc không quét được mã, hãy liên hệ người tổ chức để được xác minh và bổ sung lượt còn thiếu.</p></section><section class="panel sticky"><h2>Thông tin tham gia</h2>${[['Ngày diễn ra',fmt(e.startAt,true)],['Khung giờ',time(e.startAt)+' – '+time(e.endAt)],['Địa điểm',e.place],['Đối tượng',e.audience==='all'?'Tất cả khoa':e.audience],['Năm học',e.year==='all'?'Tất cả năm học':'Năm '+e.year],['Đóng đăng ký',fmt(e.closeAt)+' · '+time(e.closeAt)],['Sức chứa',`${m.n} / ${e.capacity} người`],['Điểm danh',modeName(e)]].map(([a,b])=>`<div class="info-row"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}<div class="gap-top">${regBadge(e,r)}</div>${cta}<p class="small-text muted gap-top">Có thể hủy trước khi sự kiện bắt đầu. Đăng ký và điểm danh là hai trạng thái riêng.</p></section></div>`;}
function registerEvent(){const e=event(),existing=e.regs[state.uid];if(!registrationOpen(e))return toast('Sự kiện không trong thời gian đăng ký.');if(!eligible(e))return toast('Bạn chưa đáp ứng điều kiện tham gia.');if(existing&&existing.status!=='Cancelled')return toast('Bạn đã có đăng ký tại sự kiện này.');const wait=metrics(e).n>=e.capacity||waiting(e).length>0;modal(wait?'Tham gia danh sách chờ?':'Xác nhận đăng ký',`<p><b>${esc(e.title)}</b></p><p>${wait?'Các chỗ hiện có đã được cấp hoặc đang dành cho người đầu hàng chờ. Bạn có muốn vào danh sách chờ không?':'Bạn sẽ được ghi nhận vào danh sách đăng ký chính thức.'}</p><div class="notice">${modeName(e)}. ${e.mode==='double'?'Hoàn thành cả check-in và check-out để được tính tham dự.':'Quét mã một lần tại sự kiện để hoàn tất điểm danh.'}</div>`,()=>{const currentWait=metrics(e).n>=e.capacity||waiting(e).length>0;e.regs[state.uid]=registration(currentWait?'Waitlisted':'Registered',false,false,Date.now());persist();render();toast(currentWait?'Đã vào danh sách chờ.':'Đăng ký thành công. Email xác nhận được mô phỏng.');},wait?'Đồng ý vào danh sách chờ':'Xác nhận đăng ký','calendar');}
function promote(e){let promoted=[];while(metrics(e).n<e.capacity&&waiting(e).length){const [uid,r]=waiting(e)[0];r.status='Registered';r.order=0;promoted.push(state.users.find(u=>u.id===uid)?.name||'Sinh viên');}return promoted;}
function cancelEvent(){const e=event(),r=e.regs[state.uid];if(!r||r.status==='Cancelled')return;if(!canCancel(e))return toast('Sự kiện đã bắt đầu hoặc kết thúc, không thể hủy.');const was=r.status==='Registered';modal(was?'Hủy đăng ký tham gia?':'Rời danh sách chờ?',`<p>${esc(e.title)}</p><p>${was?'Chỗ của bạn sẽ được nhường cho người đầu danh sách chờ, nếu có.':'Bạn sẽ không tiếp tục chờ chỗ của sự kiện này.'}</p>`,()=>{r.status='Cancelled';const names=was?promote(e):[];persist();render();toast(names.length?`Đã hủy. ${names.join(', ')} được chuyển lên đăng ký chính thức.`:'Đã hủy tham gia.');},was?'Đồng ý hủy':'Rời danh sách chờ','calendar');}
function manage(){const rows=state.events.filter(e=>e.owner===state.uid);return head('Sự kiện quản lý','Theo dõi đăng ký, chọn cách điểm danh và quản lý từng sự kiện.',`<button class="primary" onclick="go('create')">${icon('plus')} Tạo sự kiện</button>`)+`<section class="panel"><div class="table-wrap"><table><thead><tr><th>Sự kiện</th><th>Đăng ký</th><th>Điểm danh</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${rows.map(e=>{const m=metrics(e);return `<tr><td><strong>${esc(e.title)}</strong><small>${fmt(e.startAt,true)} · ${time(e.startAt)} · ${esc(e.place)}</small></td><td>${m.n} / ${e.capacity}<small>${m.waiting} người đang chờ</small></td><td>${badge(e.mode==='double'?'2 lần':'1 lần','blue')}<small>${m.done} hoàn tất${e.mode==='double'?` · ${m.partial} còn thiếu lượt`:''}</small></td><td>${badge(!e.published?'Bản nháp':e.finished?'Đã kết thúc':'Đã công bố',!e.published||e.finished?'gray':'')}</td><td><div class="row-actions"><button class="small" onclick="openEvent('${e.id}','edit')">Sửa</button><button class="small" onclick="openEvent('${e.id}','attendance')">Điểm danh</button>${!e.published?`<button class="small primary" onclick="publishEvent('${e.id}')">Công bố</button>`:''}</div></td></tr>`;}).join('')}</tbody></table></div></section>`;}
function field(label,name,value='',type='text',required=true){return `<label class="field">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${required?'required':''}></label>`;}
function createForm(edit=false){const e=edit?event():null;const mode=e?.mode||'single';return head(edit?'Cập nhật sự kiện':'Tạo sự kiện mới',edit?'Cập nhật thông tin và điều kiện hoàn tất điểm danh.':'Lưu bản nháp, kiểm tra thông tin rồi công bố cho sinh viên.')+`<form id="eventForm" class="panel"><section class="form-section"><h3 class="form-title">${icon('calendar')} Thông tin sự kiện</h3><div class="form-grid">${field('Tên sự kiện','title',e?.title||'')}${field('Địa điểm','place',e?.place||'')}<label class="field wide">Mô tả sự kiện<textarea name="description" rows="3" required>${esc(e?.description||'')}</textarea></label>${field('Bắt đầu','startAt',e?.startAt||'2026-12-05T08:00','datetime-local')}${field('Kết thúc','endAt',e?.endAt||'2026-12-05T11:30','datetime-local')}${field('Mở đăng ký','openAt',e?.openAt||'2026-11-02T08:00','datetime-local')}${field('Đóng đăng ký','closeAt',e?.closeAt||'2026-12-04T17:00','datetime-local')}${field('Số chỗ tối đa','capacity',e?.capacity||100,'number')}<label class="field">Nhóm sự kiện<select name="category">${['Học thuật','Nghề nghiệp','Văn hóa','Thể thao'].map(c=>`<option ${e?.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Đối tượng tham gia<select name="audience"><option value="all">Tất cả khoa</option><option value="${shortFaculty}" ${e?.audience===shortFaculty?'selected':''}>${shortFaculty}</option><option value="Khoa Kinh tế" ${e?.audience==='Khoa Kinh tế'?'selected':''}>Khoa Kinh tế</option></select></label><label class="field">Năm học<select name="year"><option value="all">Tất cả năm học</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${e?.year===String(n)?'selected':''}>Năm ${n}</option>`).join('')}</select></label></div></section><section class="form-section"><h3 class="form-title">${icon('qr')} Cách tính hoàn tất điểm danh</h3><div class="mode-options"><label class="mode-card"><input type="radio" name="mode" value="single" ${mode==='single'?'checked':''}>${icon('check')}<b>Điểm danh một lần</b><small>Sinh viên quét QR một lần để được tính đã tham dự.</small></label><label class="mode-card"><input type="radio" name="mode" value="double" ${mode==='double'?'checked':''}>${icon('repeat')}<b>Check-in và check-out</b><small>Sinh viên cần quét lượt vào và lượt ra. Thiếu một lượt sẽ chưa hoàn tất.</small></label></div><div class="notice">Mỗi lượt được mở riêng ở màn Điểm danh. Người tổ chức có thể xác minh và bổ sung thủ công lượt còn thiếu.</div>${edit&&registered(e).some(([,r])=>r.checkin||r.checkout)?'<p class="muted small-text">Sự kiện đã có dữ liệu điểm danh. Đổi chế độ sẽ thay đổi cách tính hoàn tất; các lượt đã ghi nhận được giữ lại.</p>':''}</section><div id="eventFormError" class="form-error" role="alert"></div><div class="form-footer"><span class="small-text muted">${edit?'Thông tin đã công bố cần được cập nhật nhất quán.':'Bản nháp chưa xuất hiện trong danh sách sinh viên.'}</span><div class="actions"><button type="button" onclick="go('manage')">Hủy</button><button class="primary" type="submit">${edit?'Lưu thay đổi':'Lưu bản nháp'}</button></div></div></form>`;}
function saveEvent(form){const d=Object.fromEntries(new FormData(form));const out=$('#eventFormError');if(!(d.openAt<d.closeAt&&d.closeAt<=d.startAt&&d.startAt<d.endAt)){out.textContent='Cần: mở đăng ký < đóng đăng ký ≤ bắt đầu < kết thúc.';return;}if(!Number.isInteger(+d.capacity)||+d.capacity<1){out.textContent='Số chỗ phải là số nguyên lớn hơn 0.';return;}const payload={title:d.title.trim(),place:d.place.trim(),description:d.description.trim(),startAt:d.startAt,endAt:d.endAt,openAt:d.openAt,closeAt:d.closeAt,capacity:+d.capacity,category:d.category,audience:d.audience,year:d.year,mode:d.mode};if(page==='edit'){const e=event();if(+d.capacity<metrics(e).n){out.textContent='Số chỗ mới đang thấp hơn số đăng ký chính thức. Vui lòng kiểm tra trước khi lưu.';return;}const changed=e.startAt!==d.startAt||e.endAt!==d.endAt||e.place!==d.place;const modeChanged=e.mode!==d.mode;const apply=()=>{Object.assign(e,payload);if(modeChanged)e.phase=null;const names=promote(e);persist();go('manage');toast(names.length?`Đã lưu. ${names.length} người đang chờ được cấp chỗ trống.`:changed&&e.published?'Đã lưu. Email cập nhật được mô phỏng cho người đã đăng ký.':'Đã lưu toàn bộ thông tin sự kiện.');};if(modeChanged&&registered(e).some(([,r])=>r.checkin||r.checkout))modal('Đổi cách tính điểm danh?',`<p>Chế độ mới: <b>${d.mode==='double'?'check-in và check-out':'điểm danh một lần'}</b>.</p><p>Các lượt cũ được giữ. Trạng thái hoàn tất và báo cáo sẽ tính lại theo chế độ mới; phiên QR đang mở sẽ đóng.</p>`,apply,'Đổi chế độ','repeat');else apply();}else{const id='e'+Date.now();state.events.push({...payload,id,unit:current().faculty,owner:state.uid,published:false,finished:false,phase:null,regs:{},poster:'NEW<br>EXPERIENCE.',kicker:'CAMPUS EVENTS / 2026',color:'purple'});selected=id;persist();go('manage');toast('Đã tạo bản nháp. Bạn có thể công bố sau khi kiểm tra.');}}
function publishEvent(id){const e=state.events.find(x=>x.id===id);modal('Công bố sự kiện?',`<p>${esc(e.title)}</p><div class="notice">${modeName(e)}<br>Sinh viên được đăng ký trong thời gian đã cấu hình.</div>`,()=>{e.published=true;persist();render();toast('Đã công bố sự kiện.');},'Công bố','calendar');}
function rosterRows(e,att=false){let rows=entries(e).filter(([,r])=>peopleFilter==='all'||r.status===peopleFilter);return rows.map(([uid,r])=>{const u=state.users.find(x=>x.id===uid);return `<tr class="person-row"><td><div class="person-cell"><span class="avatar">${initials(u.name)}</span><div><strong>${esc(u.name)}</strong><small>${esc(u.studentId||'—')}</small></div></div></td><td>${regBadge(e,r,uid)}</td>${att?`<td>${r.status==='Registered'?(r.checkin?badge(r.checkinAt||'Đã ghi nhận'):badge('Chưa có','gray')):'—'}</td>${e.mode==='double'?`<td>${r.status==='Registered'?(r.checkout?badge(r.checkoutAt||'Đã ghi nhận'):badge('Chưa có','gray')):'—'}</td>`:''}`:''}<td>${attBadge(e,r)}</td><td>${att&&r.status==='Registered'?`<button class="small" onclick="manualAttendance('${uid}')">${icon('edit')}${r.checkin||r.checkout?'Sửa lượt':'Bổ sung'}</button>`:r.status==='Waitlisted'?'<span class="muted">Chờ chuyển tự động</span>':'—'}</td></tr>`;}).join('')||`<tr><td colspan="6">${empty('Danh sách đang trống','Chưa có người tham gia ở trạng thái này.')}</td></tr>`;}
function participantTable(e,att=false){return `<section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input aria-label="Tìm người tham gia" placeholder="Tìm họ tên hoặc mã số sinh viên..." oninput="filterRows(this.value)"></label><select class="role-select" aria-label="Lọc người tham gia" onchange="peopleFilter=this.value;render()">${[['all','Tất cả trạng thái'],['Registered','Đã đăng ký'],['Waitlisted','Danh sách chờ'],['Cancelled','Đã hủy']].map(([v,t])=>`<option value="${v}" ${peopleFilter===v?'selected':''}>${t}</option>`).join('')}</select><button onclick="exportCSV()">${icon('download')} Xuất CSV</button></div><div class="table-wrap"><table><thead><tr><th>Sinh viên</th><th>Đăng ký</th>${att?`<th>${e.mode==='double'?'Check-in':'Lượt điểm danh'}</th>${e.mode==='double'?'<th>Check-out</th>':''}`:''}<th>Kết quả</th><th>${att?'Điều chỉnh':'Ghi chú'}</th></tr></thead><tbody>${rosterRows(e,att)}</tbody></table></div></section>`;}
function filterRows(q){document.querySelectorAll('.person-row').forEach(el=>el.hidden=!el.textContent.toLocaleLowerCase('vi').includes(q.toLocaleLowerCase('vi')));}
function stats(e){const m=metrics(e);return `<div class="stats">${[['Đăng ký chính thức',m.n,'Không tính người chờ / đã hủy','users',''],['Đã hoàn tất',m.done,e.mode==='double'?'Đủ check-in và check-out':'Đã điểm danh một lần','check','green'],[e.mode==='double'?'Còn thiếu check-out':'Chưa điểm danh',e.mode==='double'?m.partial:m.notStarted,e.mode==='double'?'Đã vào, chưa ghi nhận lượt ra':'Chưa có lượt hợp lệ','clock','amber'],['Tỷ lệ hoàn tất',m.rate===null?'—':m.rate+'%',m.n?`${m.done} / ${m.n} người đăng ký`:'Chưa có người đăng ký','chart','']].map(([a,b,c,i,cl])=>`<div class="stat ${cl}"><div class="stat-top"><span>${a}</span>${icon(i)}</div><strong>${b}</strong><small>${c}</small></div>`).join('')}</div>`;}
function qrPattern(e,phase){let a=0;const seed=e.id+phase;for(const c of seed)a=(a*31+c.charCodeAt(0))>>>0;let cells='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const finder=(x<7&&y<7)||(x>17&&y<7)||(x<7&&y>17);if(finder)continue;a=(a*1664525+1013904223)>>>0;if(a&0x40000000)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}for(const [x,y] of [[0,0],[18,0],[0,18]])cells+=`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="white"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;return `<svg viewBox="-1 -1 27 27" shape-rendering="crispEdges" aria-label="QR minh họa" role="img" fill="#1a2c4f">${cells}</svg>`;}
function attendance(){const pick=picker(),e=event();if(e.mode==='single')phaseChoice='checkin';const currentLabel=e.phase?(e.mode==='single'?'Lượt điểm danh':e.phase==='checkin'?'Check-in':'Check-out'):'';return head('Quản lý điểm danh','Mở QR theo từng lượt và bổ sung kết quả khi cần.',pick)+stats(e)+`<div class="split equal gap-bottom"><section class="panel"><div class="att-top"><div><h3>Phiên điểm danh QR</h3><p class="small-text muted">${modeName(e)}</p></div>${badge(e.phase?'Đang mở '+currentLabel:'Phiên đã đóng',e.phase?'blue':'gray')}</div>${e.mode==='double'?`<div class="phase-bar"><button class="phase-choice ${phaseChoice==='checkin'?'active':''}" onclick="phaseChoice='checkin';render()"><span class="phase-dot"></span><b>01 · Check-in</b><span>Ghi nhận lúc sinh viên vào</span></button><button class="phase-choice ${phaseChoice==='checkout'?'active':''}" onclick="phaseChoice='checkout';render()"><span class="phase-dot"></span><b>02 · Check-out</b><span>Ghi nhận lúc sinh viên ra</span></button></div>`:'<div class="notice">Sinh viên quét QR một lần để hoàn tất điểm danh.</div>'}<button class="primary block" onclick="togglePhase()" ${!e.published?'disabled':''}>${icon(e.phase===phaseChoice?'lock':'qr')} ${e.phase===phaseChoice?'Đóng':e.phase?'Chuyển sang':'Mở'} ${e.mode==='single'?'lượt điểm danh':phaseChoice==='checkin'?'check-in':'check-out'}</button><p class="small-text muted gap-top">${e.phase&&e.phase!==phaseChoice?'Khi chuyển lượt, QR cũ sẽ hết hiệu lực.':'Chỉ sinh viên đăng ký chính thức được ghi nhận.'}</p>${!e.published?'<div class="notice warn">Công bố sự kiện trước khi mở điểm danh.</div>':''}</section><section class="qr-panel">${e.phase?`<span class="eyebrow">${currentLabel}</span><h3>${esc(e.title)}</h3><div class="qr-wrap">${qrPattern(e,e.phase)}<span class="qr-overlay">QR MẪU</span></div><div class="qr-caption">Mã minh họa cho lượt ${currentLabel.toLowerCase()}<br>Chuyển sang vai trò Sinh viên để quét thử.</div>`:`<div class="qr-empty">${icon('qr')}</div><h3>Chưa có QR đang mở</h3><p class="muted small-text gap-top">Chọn lượt rồi bấm mở điểm danh.</p>`}</section></div><div class="section-head"><div><h2>Kết quả theo từng sinh viên</h2><p>${e.mode==='double'?'Thiếu check-out được giữ riêng với người chưa điểm danh.':'Một lượt hợp lệ tương ứng một người hoàn tất.'}</p></div></div>${participantTable(e,true)}`;}
function togglePhase(){const e=event();if(!e.published)return;if(e.phase===phaseChoice)e.phase=null;else e.phase=phaseChoice;persist();render();toast(e.phase?'Đã mở '+(e.mode==='single'?'điểm danh':e.phase==='checkin'?'check-in':'check-out')+'. QR mẫu đã cập nhật.':'Đã đóng phiên. QR của lượt này hết hiệu lực.');}
function participants(){const pick=picker(),e=event(),m=metrics(e);return head('Danh sách người tham gia','Theo dõi danh sách chính thức, thứ tự chờ và kết quả điểm danh.',pick)+`<div class="notice">${m.n} đăng ký chính thức · ${m.waiting} người đang chờ · ${modeName(e)}</div>${participantTable(e)}`;}
function manualAttendance(uid){const e=event(),r=e.regs[uid],u=state.users.find(x=>x.id===uid);if(r?.status!=='Registered')return;modal(r.checkin||r.checkout?'Điều chỉnh lượt điểm danh':'Bổ sung điểm danh',`<p><b>${esc(u.name)}</b> · ${esc(u.studentId)}</p><label class="checkline"><input id="manualIn" type="checkbox" ${r.checkin?'checked':''}><span><b>${e.mode==='double'?'Đã check-in':'Đã điểm danh'}</b><small>${r.checkin?'Đã ghi nhận lúc '+esc(r.checkinAt):'Đánh dấu sau khi xác minh sinh viên có mặt.'}</small></span></label>${e.mode==='double'?`<label class="checkline"><input id="manualOut" type="checkbox" ${r.checkout?'checked':''}><span><b>Đã check-out</b><small>Cần có check-in và check-out để hoàn tất.</small></span></label>`:''}<label class="field gap-top">Lý do điều chỉnh<textarea id="manualReason" rows="3" placeholder="Ví dụ: xác minh sinh viên có mặt nhưng không quét được QR" required></textarea></label>`,()=>{const ci=$('#manualIn').checked,co=e.mode==='double'?$('#manualOut').checked:r.checkout,reason=$('#manualReason').value.trim();if(!reason)return error('Vui lòng nhập lý do bổ sung hoặc điều chỉnh.');if(e.mode==='double'&&co&&!ci)return error('Check-out cần đi cùng lượt check-in. Hãy kiểm tra cả hai lượt.');r.history.push({at:new Date().toISOString(),reason,before:{checkin:r.checkin,checkout:r.checkout},after:{checkin:ci,checkout:co},by:state.uid});r.checkinAt=ci?(r.checkinAt||stamp()):'';r.checkoutAt=co?(r.checkoutAt||stamp()):'';r.checkin=ci;r.checkout=co;persist();render();toast('Đã lưu. Kết quả của sinh viên và báo cáo đã cập nhật.');},'Lưu kết quả','edit');}
function scan(){const choices=state.events.filter(e=>e.published&&e.regs[state.uid]?.status==='Registered');if(!choices.length)return head('Điểm danh bằng QR','Quét QR do người tổ chức hiển thị.')+`<section class="panel">${empty('Bạn chưa có đăng ký chính thức','Người đang trong danh sách chờ chưa thể điểm danh.',`<button class="primary" onclick="go('explore')">Khám phá sự kiện</button>`)}</section>`;if(!choices.some(e=>e.id===selected))selected=choices[0].id;const e=event(),r=e.regs[state.uid],label=e.phase?(e.mode==='single'?'Điểm danh một lần':e.phase==='checkin'?'Check-in':'Check-out'):'';return head('Điểm danh bằng QR','Kết quả được ghi nhận riêng theo từng lượt của sự kiện.')+`<div class="scan-shell"><section class="panel"><label class="field">Sự kiện đã đăng ký<select aria-label="Sự kiện quét QR" onchange="selected=this.value;render()">${choices.map(e=>`<option value="${e.id}" ${e.id===selected?'selected':''}>${esc(e.title)}</option>`).join('')}</select></label><div class="att-top"><span class="small-text muted">${modeName(e)}</span>${attBadge(e,r)}</div><div class="scan-view"><div class="scan-target">${icon('qr')}</div><span class="scan-hint">Khung quét minh họa · Không mở camera</span></div>${e.phase?`<div class="notice success">Người tổ chức đang mở <b>${label}</b>.</div>`:'<div class="notice warn">Chưa có lượt QR đang mở. Bạn có thể xem trạng thái hoặc liên hệ người tổ chức.</div>'}<button class="primary block" onclick="scanCurrent()">${icon('camera')} Quét thử mã hiện tại</button><button class="ghost block gap-top" onclick="scanHelp()">Không quét được? Xem hướng dẫn</button><div class="section-head"><h3>Tiến độ của bạn</h3></div>${timeline(e,r)}</section></div>`;}
function scanCurrent(){const e=event(),r=e.regs[state.uid];if(r?.status!=='Registered')return toast('Cần đăng ký chính thức trước khi điểm danh.');if(!e.phase)return modal('QR chưa có hiệu lực','<p>Phiên điểm danh chưa được mở hoặc đã đóng. Hãy kiểm tra mã đang hiển thị hoặc liên hệ người tổ chức để được xác minh, bổ sung.</p>',()=>true,'Đã hiểu','lock');const phase=e.phase;if(phase==='checkout'&&!r.checkin)return modal('Bạn còn thiếu check-in','<p>Hệ thống chưa có lượt check-in của bạn. Hãy liên hệ người tổ chức để được kiểm tra và bổ sung trước khi hoàn tất check-out.</p>',()=>true,'Đã hiểu','info');if(r[phase])return toast(`Lượt ${e.mode==='single'?'điểm danh':phase==='checkin'?'check-in':'check-out'} đã được ghi nhận lúc ${r[phase+'At']}.`);r[phase]=true;r[phase+'At']=stamp();r.history.push({at:new Date().toISOString(),method:'QR mẫu',phase,by:state.uid});persist();render();modal(complete(e,r)?'Bạn đã hoàn tất điểm danh':'Check-in thành công',`<p><b>${esc(e.title)}</b></p><div class="notice success">${complete(e,r)?'Đã đủ các lượt theo yêu cầu. Bạn được ghi nhận tham dự.':'Đã ghi nhận lượt vào. Bạn còn cần check-out khi kết thúc sự kiện.'}</div>${timeline(e,r)}`,()=>true,'Đóng','check');}
function scanHelp(){modal('Bổ sung lượt bị thiếu','<p>Nếu đến muộn, thiết bị gặp lỗi hoặc mã đã đóng, hãy báo MSSV và lượt còn thiếu cho người tổ chức. Người tổ chức sẽ xác minh trước khi cập nhật thủ công.</p>',()=>true,'Đã hiểu','info');}
function report(){const pick=picker(),e=event(),m=metrics(e);return head('Báo cáo sự kiện','Số liệu tính trực tiếp từ đăng ký và các lượt điểm danh hiện tại.',pick)+`<div class="notice ${e.finished?'':'warn'}">${e.finished?'Báo cáo sau sự kiện.':'Số liệu hiện tại, chưa phải kết quả cuối cùng của sự kiện.'} ${e.mode==='double'?'Chỉ người đủ check-in và check-out được tính hoàn tất.':'Một lượt hợp lệ được tính hoàn tất.'}</div>${stats(e)}<div class="split equal gap-bottom"><section class="panel"><div class="section-head" style="margin-top:0"><h3>Mức độ hoàn tất điểm danh</h3>${badge(modeName(e),'blue')}</div><div class="progress-track"><span style="width:${m.rate||0}%"></span></div><div class="legend"><span><i class="legend-dot"></i>Hoàn tất<b>${m.done}</b></span>${e.mode==='double'?`<span><i class="legend-dot amber"></i>Thiếu check-out<b>${m.partial}</b></span>`:''}<span><i class="legend-dot gray"></i>${e.finished?'Chưa ghi nhận / vắng':'Chưa điểm danh'}<b>${m.notStarted}</b></span></div><p class="small-text muted gap-top">Tỷ lệ = số người hoàn tất / số đăng ký chính thức. Không tính người đã hủy hoặc đang chờ. Không có đăng ký thì tỷ lệ không áp dụng.</p></section><section class="panel"><h3>Tổng hợp theo từng lượt</h3><div class="info-row"><span>${e.mode==='double'?'Có check-in':'Có lượt điểm danh'}</span><b>${registered(e).filter(([,r])=>r.checkin).length} người</b></div>${e.mode==='double'?`<div class="info-row"><span>Có check-out</span><b>${registered(e).filter(([,r])=>r.checkout).length} người</b></div>`:''}<div class="info-row"><span>Chưa hoàn tất${e.finished?' / không đạt điều kiện tham dự':''}</span><b>${m.n-m.done} người</b></div><button class="block gap-top" onclick="exportCSV()">${icon('download')} Xuất báo cáo CSV</button></section></div><div class="section-head"><h2>Chi tiết người tham gia</h2></div>${participantTable(e,true)}`;}
function csvCell(v){return '"'+String(v??'').replaceAll('"','""')+'"';}
function csvData(e,reportMode=false){const m=metrics(e),rows=[];if(reportMode){rows.push(['Sự kiện',e.title],['Chế độ điểm danh',modeName(e)],['Đăng ký chính thức',m.n],['Hoàn tất',m.done],['Thiếu check-out',m.partial],['Chưa điểm danh',m.notStarted],['Tỷ lệ hoàn tất',m.rate===null?'Không áp dụng':m.rate+'%'],[]);}rows.push(['MSSV','Họ tên','Trạng thái đăng ký','Vị trí chờ','Check-in','Check-out','Kết quả']);for(const [uid,r] of entries(e)){const u=state.users.find(x=>x.id===uid);rows.push([u.studentId,u.name,r.status,r.status==='Waitlisted'?waiting(e).findIndex(([id])=>id===uid)+1:'',r.checkinAt||'',e.mode==='double'?(r.checkoutAt||''):'Không áp dụng',r.status!=='Registered'?'Không áp dụng':complete(e,r)?'Hoàn tất':r.checkin?'Thiếu check-out':e.finished?'Vắng mặt':'Chưa điểm danh']);}return rows.map(row=>row.map(csvCell).join(',')).join('\r\n');}
function exportCSV(){const e=event(),data='\ufeff'+csvData(e,page==='report');const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`${page==='report'?'bao-cao':'danh-sach'}-${e.id}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Đã xuất CSV theo dữ liệu hiện tại của sự kiện.');}
function accountView(){return head('Quản lý tài khoản','Tra cứu tài khoản, trạng thái truy cập và vai trò.',`<button class="primary" onclick="go('account-create')">${icon('plus')} Cấp tài khoản</button>`)+`<section class="panel"><div class="toolbar"><label class="search">${icon('search')}<input aria-label="Tìm tài khoản" placeholder="Tìm họ tên, email hoặc MSSV..." oninput="filterRows(this.value)"></label><button class="small" onclick="resetDemo()">${icon('reset')} Khôi phục dữ liệu mẫu</button></div><div class="table-wrap"><table><thead><tr><th>Tài khoản</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>${state.users.map(u=>`<tr class="person-row"><td><div class="person-cell"><span class="avatar ${u.role==='organizer'?'green':''}">${initials(u.name)}</span><div><strong>${esc(u.name)}</strong><small>${esc(u.email)}${u.studentId?' · '+esc(u.studentId):''}</small></div></div></td><td>${human[u.role]}</td><td>${badge(u.locked?'Đã khóa':'Hoạt động',u.locked?'gray':'')}</td><td><div class="row-actions"><button class="small" onclick="accountAction('${u.id}','lock')">${u.locked?'Mở khóa':'Khóa'}</button><button class="small" onclick="accountAction('${u.id}','role')">Đổi vai trò</button></div></td></tr>`).join('')}</tbody></table></div></section>`;}
function accountAction(uid,action){const u=state.users.find(x=>x.id===uid);modal(action==='role'?'Thay đổi vai trò':u.locked?'Mở khóa tài khoản':'Khóa tài khoản',`<p><b>${esc(u.name)}</b><br>${esc(u.email)}</p>${action==='role'?`<label class="field">Vai trò mới<select id="nextRole">${Object.entries(human).map(([v,n])=>`<option value="${v}" ${u.role===v?'selected':''}>${n}</option>`).join('')}</select></label>`:''}<label class="field">Lý do<textarea id="accountReason" rows="3"></textarea></label>`,()=>{if(!$('#accountReason').value.trim())return error('Vui lòng nhập lý do.');if(action==='role')u.role=$('#nextRole').value;else u.locked=!u.locked;if(uid===state.uid){persist();logout();}else{persist();render();}toast('Đã cập nhật tài khoản mẫu.');},'Lưu thay đổi','shield');}
function accountCreate(){return head('Cấp tài khoản người tổ chức','Tạo tài khoản mẫu cho người được phân công phụ trách sự kiện.')+`<form id="accountForm" class="panel" style="max-width:720px"><h3 class="form-title">${icon('users')} Thông tin người tổ chức</h3>${field('Họ và tên','name')}${field('Email','email','','email')}${field('Đơn vị tổ chức','faculty')}<div class="form-error" id="accountFormError" role="alert"></div><div class="form-footer"><span class="small-text muted">Tài khoản được cấp vai trò Người tổ chức.</span><button class="primary" type="submit">Cấp tài khoản</button></div></form>`;}
function saveAccount(form){const d=Object.fromEntries(new FormData(form));if(state.users.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase())){$('#accountFormError').textContent='Email đã tồn tại. Hãy tra cứu tài khoản để điều chỉnh vai trò.';return;}state.users.push({id:'u'+Date.now(),name:d.name.trim(),email:d.email.trim(),faculty:d.faculty.trim(),role:'organizer',locked:false});persist();go('accounts');toast('Đã tạo tài khoản Người tổ chức trong dữ liệu mẫu.');}
function logout(){state.authenticated=false;page='login';persist();render();window.scrollTo(0,0);}
function auth(signup=false){return `<div class="auth-shell"><section class="auth-art">${brand()}<div><h1>Những trải nghiệm<br>bắt đầu từ đây.</h1><p>Một không gian cho sự kiện, đăng ký và từng lượt tham gia tại trường.</p></div><small>Campus Events · Bản tương tác minh họa</small></section><section class="auth-content"><div class="auth-box"><div class="eyebrow">${signup?'TÀI KHOẢN SINH VIÊN':'CHÀO MỪNG TRỞ LẠI'}</div><h1>${signup?'Đăng ký tài khoản':'Đăng nhập'}</h1><p>${signup?'Tự tạo tài khoản để tìm sự kiện và theo dõi đăng ký.':'Dùng tài khoản mẫu hoặc nhập email đã tạo trong bản thử nghiệm.'}</p><form id="authForm">${signup?field('Họ và tên','name')+field('Mã số sinh viên','studentId'):''}${field('Email','email','','email')}${field('Mật khẩu mẫu','password','','password')}${signup?`<div class="form-grid"><label class="field">Khoa<select name="faculty"><option>${shortFaculty}</option><option>Khoa Kinh tế</option></select></label><label class="field">Năm học<select name="year">${[1,2,3,4,5].map(n=>`<option value="${n}">Năm ${n}</option>`).join('')}</select></label></div>`:''}<div class="form-error" id="authError" role="alert"></div><button class="primary block" type="submit">${signup?'Tạo tài khoản':'Đăng nhập bản mẫu'} ${icon('arrow')}</button></form><button class="ghost block gap-top" onclick="page='${signup?'login':'signup'}';render()">${signup?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký sinh viên'}</button>${signup?'':`<div class="divider">hoặc mở nhanh tài khoản mẫu</div><div class="demo-logins">${[['student','Minh Anh · Sinh viên','Đăng ký, quét QR và xem kết quả'],['organizer','Thu Hà · Người tổ chức','Mở từng lượt QR, bổ sung điểm danh'],['admin','Quản trị viên','Quản lý tài khoản và vai trò']].map(([r,n,s])=>`<button onclick="setRole('${r}')"><span>${n}<small>${s}</small></span>${icon('arrow')}</button>`).join('')}</div>`}<p class="small-text muted gap-top">Dữ liệu chỉ lưu trên thiết bị. Không nhập mật khẩu thật; bản mẫu chưa có xác thực hoặc dịch vụ email.</p></div></section></div>`;}
function saveAuth(form){const d=Object.fromEntries(new FormData(form));if(page==='signup'){if(state.users.some(u=>u.email.toLowerCase()===d.email.trim().toLowerCase()||u.studentId&&u.studentId===d.studentId.trim())){$('#authError').textContent='Email hoặc MSSV đã tồn tại.';return;}state.users.push({id:'s'+Date.now(),name:d.name.trim(),studentId:d.studentId.trim(),email:d.email.trim(),faculty:d.faculty,year:d.year,role:'student',locked:false});persist();page='login';render();toast('Tạo tài khoản mẫu thành công. Bạn có thể đăng nhập bằng email vừa tạo.');}else{const u=state.users.find(u=>u.email.toLowerCase()===d.email.trim().toLowerCase());if(!u){$('#authError').textContent='Chưa tìm thấy email trong dữ liệu mẫu.';return;}if(u.locked){$('#authError').textContent='Tài khoản đang bị khóa.';return;}state.uid=u.id;state.role=u.role;state.authenticated=true;page=menu[u.role][0][0];persist();render();}}
function resetDemo(){modal('Khôi phục dữ liệu minh họa?','<p>Thao tác chỉ xóa các thay đổi trong bản mẫu này và khôi phục sự kiện, tài khoản ban đầu trên thiết bị.</p>',()=>{state=seed();state.role='admin';state.uid='a1';page='accounts';selected='e1';persist();render();toast('Đã khôi phục dữ liệu mẫu.');},'Khôi phục','reset');}
function render(){if(!state.authenticated){$('#app').innerHTML=auth(page==='signup');$('#authForm').onsubmit=e=>{e.preventDefault();saveAuth(e.target);};return;}if(!menu[state.role])state.role='student';if(!state.events.some(e=>e.id===selected))selected=state.events[0].id;if(state.role==='organizer'&&['participants','attendance','report','edit'].includes(page)&&!state.events.some(e=>e.owner===state.uid)){ $('#app').innerHTML=shell(head('Chưa có sự kiện quản lý','Tạo sự kiện để bắt đầu quản lý đăng ký và điểm danh.')+empty('Bạn chưa phụ trách sự kiện nào','Mỗi người tổ chức chỉ xem dữ liệu sự kiện mình phụ trách.',`<button class="primary" onclick="go('create')">Tạo sự kiện</button>`));return;}const views={explore:()=>explore(),mine:()=>explore(true),detail,manage,create:()=>createForm(),edit:()=>createForm(true),participants,attendance,scan,report,accounts:accountView,'account-create':accountCreate};$('#app').innerHTML=shell((views[page]||views.explore)());if($('#cards'))fillCards();if($('#eventForm'))$('#eventForm').onsubmit=e=>{e.preventDefault();saveEvent(e.target);};if($('#accountForm'))$('#accountForm').onsubmit=e=>{e.preventDefault();saveAccount(e.target);};}
render();

</script></body></html>
